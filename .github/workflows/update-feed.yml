name: Update

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Adjust refresh schedule here. By default, it runs once per day.
    # Syntax reference: https://docs.github.com/en/actions/reference/events-that-trigger-workflows#schedule
    # Recommended tool: https://crontab.guru/
    - cron: "37 5 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Download ArxivFeed
        env:
          GITHUB_PAT: ${{ github.token }}
          REPO: "NotCraft/ArxivFeed"
          VERSION: "latest"
          MATCH: "arxivfeed-.+-x86_64-unknown-linux-musl.tar.gz$"
          RENAME: "arxivfeed.tgz"
        shell: bash
        run: |
          curl -sL --fail \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${GITHUB_PAT}" \
              "https://api.github.com/repos/${REPO}/releases/${VERSION}" \
              | jq -r ".assets | .[] | select(.name | test(\"${MATCH}\")) | .url" \
              | tee asset.url
          curl -sL --fail \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GITHUB_PAT}" \
              -o "${RENAME}" \
              "$(cat asset.url)"
          tar -zxvf arxivfeed.tgz --strip-components 1 $(tar tf arxivfeed.tgz | grep /arxivfeed)
          chmod +x arxivfeed
      - name: Build rss
        id: build_rss
        shell: bash
        run: |
          attempts=3
          transient_failure=0

          for attempt in 1 2 3; do
            echo "Build rss attempt ${attempt}/${attempts}"
            log_file="arxivfeed-attempt-${attempt}.log"

            if timeout 120s ./arxivfeed > "${log_file}" 2>&1; then
              cat "${log_file}"
              echo "build_succeeded=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            status=$?
            cat "${log_file}"

            if [ "${status}" -eq 124 ]; then
              transient_failure=1
              echo "::warning::ArxivFeed attempt ${attempt} timed out."
            elif grep -Eiq "Rate exceeded|HTTP.*429|Unexpected closing tag: head, expected meta" "${log_file}"; then
              transient_failure=1
              echo "::warning::ArxivFeed attempt ${attempt} hit a likely transient arXiv API failure."
            fi

            if [ "${attempt}" -eq "${attempts}" ]; then
              if [ "${transient_failure}" -eq 1 ]; then
                echo "::warning::Skipping deploy because arXiv API is rate-limited or unresponsive after ${attempts} attempts."
                echo "build_succeeded=false" >> "${GITHUB_OUTPUT}"
                exit 0
              fi

              echo "Build rss failed after ${attempts} attempts."
              exit 1
            fi

            sleep_seconds=$((attempt * 120))
            echo "Build rss failed; retrying in ${sleep_seconds}s..."
            sleep "${sleep_seconds}"
          done
      - name: Deploy to GitHub Pages
        if: steps.build_rss.outputs.build_succeeded == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target
          force_orphan: true
